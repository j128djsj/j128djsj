<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Full-Duplex Speech LLMs</title>
  <desc id="desc">Animated waveform banner for current research on full-duplex speech large language models.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071426"/>
      <stop offset="52%" stop-color="#17133A"/>
      <stop offset="100%" stop-color="#082D3B"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
    <style>
      .dash { stroke-dasharray: 18 12; animation: travel 7s linear infinite; }
      .dash2 { stroke-dasharray: 9 15; animation: travel 10s linear infinite reverse; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
      .pulse2 { animation-delay: 1.1s; }
      @keyframes travel { to { stroke-dashoffset: -300; } }
      @keyframes pulse { 0%,100% { opacity:.35; transform:scale(.82); } 50% { opacity:1; transform:scale(1.18); } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="28" fill="url(#grid)"/>
  <circle cx="930" cy="68" r="210" fill="url(#glow)"/>
  <circle cx="180" cy="275" r="180" fill="url(#glow)" opacity=".5"/>

  <g transform="translate(600 45)">
    <rect x="-108" y="0" width="216" height="32" rx="16" fill="#FFFFFF" fill-opacity=".08" stroke="#A78BFA" stroke-opacity=".55"/>
    <circle cx="-84" cy="16" r="5" fill="#22D3EE" class="pulse"/>
    <text x="10" y="21" text-anchor="middle" fill="#D8D6FE" font-size="13" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="2">CURRENT RESEARCH</text>
  </g>

  <text x="600" y="126" text-anchor="middle" fill="#FFFFFF" font-size="48" font-weight="750" font-family="Arial, Helvetica, sans-serif">Full-Duplex Speech LLMs</text>
  <text x="600" y="164" text-anchor="middle" fill="#B9C5D8" font-size="19" font-family="Arial, Helvetica, sans-serif" letter-spacing=".4">Simultaneous listening and speaking  ·  Natural two-way dialogue</text>

  <g fill="none" stroke-linecap="round">
    <path d="M0 236 C80 236 96 198 146 198 S212 270 272 270 S346 191 410 191 S482 252 548 252 S620 205 684 205 S756 267 824 267 S902 190 968 190 S1050 238 1200 238"
      stroke="url(#wave)" stroke-width="3" opacity=".3" class="dash2"/>
    <path d="M0 229 C88 229 108 247 158 247 S226 210 290 210 S360 260 426 260 S498 191 564 191 S638 248 704 248 S778 215 846 215 S924 252 990 252 S1080 228 1200 228"
      stroke="url(#wave)" stroke-width="4" opacity=".88" class="dash" filter="url(#softGlow)"/>
    <path d="M0 247 C100 247 124 227 184 227 S260 250 328 250 S402 220 468 220 S544 242 608 242 S684 226 750 226 S828 250 898 250 S982 222 1044 222 S1120 247 1200 247"
      stroke="#38BDF8" stroke-width="2" opacity=".22"/>
  </g>

  <g fill="#FFFFFF">
    <circle cx="290" cy="210" r="5" fill="#38BDF8" class="pulse"/>
    <circle cx="564" cy="191" r="6" fill="#A78BFA" class="pulse pulse2"/>
    <circle cx="846" cy="215" r="5" fill="#22D3EE" class="pulse"/>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="298.5" rx="27.25" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="1.5"/>
</svg>
